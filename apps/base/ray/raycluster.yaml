apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray
  namespace: ray
spec:
  rayVersion: "2.56.1"

  enableInTreeAutoscaling: true

  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"

    template:
      spec:
        containers:
          - name: ray-head
            image: ghcr.io/ihoholko/ray:0.1.0

            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi

  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 1
      minReplicas: 0
      maxReplicas: 10

      template:
        spec:
          containers:
            - name: ray-worker
              image: ghcr.io/ihoholko/ray:0.1.0

              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 1Gi