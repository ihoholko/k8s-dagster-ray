apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: s3
spec:
  interval: 30m

  chart:
    spec:
      chart: seaweedfs
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: s3
      version: ">=4.0.0 <5.0.0"

  values:
    global:
      seaweedfs:
        enableReplication: false

    master:
      enabled: true
      replicas: 1

      data:
        type: persistentVolumeClaim
        size: 5Gi

    volume:
      enabled: true
      replicas: 1

      dataDirs:
        - name: data
          type: persistentVolumeClaim
          size: 50Gi
          maxVolumes: 0

    filer:
      enabled: true
      replicas: 1

      data:
        type: persistentVolumeClaim
        size: 10Gi

      ingresses:
        http:
          enabled: false

    s3:
      enabled: true
      replicas: 1

      port: 8333

      enableAuth: true

      credentials:
        admin:
          accessKey: admin
          secretKey: CHANGE_ME

    admin:
      enabled: true

      replicas: 1

      ingress:
        enabled: false

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi