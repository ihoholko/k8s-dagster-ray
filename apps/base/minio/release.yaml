apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 30m
  releaseName: minio
  chart:
    spec:
      chart: minio
      version: "5.4.x"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: minio
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    image:
      repository: quay.io/minio/minio
      tag: RELEASE.2024-12-18T13-15-44Z
      pullPolicy: IfNotPresent
    mode: standalone
    replicas: 1
    rootUser: minioadmin
    rootPassword: minioadmin123
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    service:
      type: ClusterIP
    consoleService:
      type: ClusterIP
    buckets:
      - name: dagster
        policy: none
        purge: false
