apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-ci
  namespace: default
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - backend-ci.x.com

  rules:
    - backendRefs:
        - name: backend-ci
          port: 80