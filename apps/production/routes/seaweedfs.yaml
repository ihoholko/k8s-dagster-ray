apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
  namespace: s3
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - s3.x.com

  rules:
    - backendRefs:
        - name: seaweedfs-s3
          port: 8333
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-admin
  namespace: s3
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - admin.s3.x.com

  rules:
    - backendRefs:
        - name: seaweedfs-admin
          port: 23646