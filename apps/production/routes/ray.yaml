apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ray-dashboard
  namespace: ray
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - ray.x.com
  rules:
    - backendRefs:
        - name: ray-head-svc
          port: 8265