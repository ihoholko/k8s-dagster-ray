apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dagster
  namespace: dagster
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - dagster.x.com

  rules:
    - backendRefs:
        - name: dagster-webserver
          port: 80