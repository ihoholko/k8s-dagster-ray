apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagster
spec:
  chart:
    spec:
      version: ">=1.13.0 <1.14.0"
  values:
    dagsterWebserver:
      replicaCount: 2
    dagster-user-deployments:
      deployments:
        - name: dagster-pipelines
          image:
            repository: ghcr.io/ihoholko/dagster-pipelines
            tag: 0.1.0 # {"$imagepolicy": "dagster:dagster-pipelines:tag"}
            pullPolicy: Always
          replicaCount: 2
          port: 3030
