
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dagster-pipelines-image-updater
  namespace: dagster
spec:
  interval: 12h
  targetNamespace: dagster
  timeout: 5m # give up waiting after 5 minutes
  retryInterval: 5m # retry every 5 minutes on apply or waiting failures
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/templates/image-auto-updater
  prune: true
  postBuild:
    substitute:
      repository: ghcr.io/ihoholko/dagster-pipelines
      app_name: dagster-pipelines
      reg_secret: ghcr-credentials
  patches:
    - patch: |-
        apiVersion: image.toolkit.fluxcd.io/v1beta2
        kind: ImagePolicy
        metadata:
          name: not-used
        spec:
          policy:
            semver:
              range: '>=0.1.0'
          policy:
            numerical:
              order: asc
      target:
        kind: ImagePolicy
