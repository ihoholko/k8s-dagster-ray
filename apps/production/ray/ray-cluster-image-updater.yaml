
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ray-image-updater
  namespace: ray
spec:
  interval: 12h
  targetNamespace: ray
  timeout: 5m # give up waiting after 5 minutes
  retryInterval: 5m # retry every 5 minutes on apply or waiting failures
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/templates/image-auto-updater
  prune: true
  postBuild:
    substitute:
      repository: ghcr.io/ihoholko/ray-cpu
      app_name: ray-cpu
      reg_secret: ghcr-credentials
  patches:
    - patch: |-
        apiVersion: image.toolkit.fluxcd.io/v1
        kind: ImagePolicy
        metadata:
          name: not-used
        spec:
          policy:
            semver:
              range: '>=0.1.0'
      target:
        kind: ImagePolicy
    - patch: |-
        apiVersion: image.toolkit.fluxcd.io/v1
        kind: ImageUpdateAutomation
        metadata:
          name: not-used
        spec:
          update:
            path: ./apps/production/ray
      target:
        kind: ImageUpdateAutomation
