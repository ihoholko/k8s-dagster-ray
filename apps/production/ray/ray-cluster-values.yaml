apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray
spec:
  headGroupSpec:
    template:
      spec:
        containers:
          - name: ray-head
            image: ghcr.io/ihoholko/ray-cpu:0.1.1 # {"$imagepolicy": "ray:ray-cpu:tag"}
  workerGroupSpecs:
    - groupName: cpu-workers
      template:
        spec:
          containers:
            - name: ray-worker
              image: ghcr.io/ihoholko/ray-cpu:0.1.1 # {"$imagepolicy": "ray:ray-cpu:tag"}